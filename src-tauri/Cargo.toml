[package]
name = "cysec-construct"
version = "0.1.0"
description = "CySec Construct construction management desktop application"
authors = ["CySec Guardians"]
edition = "2021"

[lib]
name = "material_management_system_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
tauri = { version = "2.8", features = [] }
tauri-plugin-deep-link = "2.6"
serde_json = "1"

[target."cfg(windows)".dependencies]
tauri-plugin-single-instance = { version = "2.5", features = ["deep-link"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
