name: Windows Desktop Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        working-directory: app
        run: npm install

      - name: Install Tauri CLI
        run: npm install --global @tauri-apps/cli@2

      - name: Generate Windows icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri/icons" | Out-Null
          $iconBase64 = 'AAABAAEAICAAAAEAIACXAAAAFgAAAIlQTkcNChoKAAAADUlRIRIAAAAgAAAAIAgGAAAAc3p69AAAAF5JREFUeNpjkNO0/j+QmGHUAaMOGHXAqAMIKYABUg0mVt/QcQApjiBFD0khQIyByGppEgX4DEVXR7M0gM1gbGpomggJhcrwywWjDhh1wKgDyAWjDZJRB4w6YNQBhDAArdnPwa0E4GsAAAAASUVORK5CYII='
          [IO.File]::WriteAllBytes("src-tauri/icons/icon.ico", [Convert]::FromBase64String($iconBase64))
          Write-Host "Created src-tauri/icons/icon.ico"

      - name: Build Windows installer
        run: tauri build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: material-management-system-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
