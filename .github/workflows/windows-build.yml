name: Windows Desktop Build

on:
  workflow_dispatch:
  push:
    branches: [main, feature/construction-contractor-workflows]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        working-directory: app
        run: npm install

      - name: Install Tauri CLI
        run: npm install --global @tauri-apps/cli@2

      - name: Generate source PNG icon
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          New-Item -ItemType Directory -Force -Path "src-tauri" | Out-Null
          $bitmap = New-Object System.Drawing.Bitmap 256, 256
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.Clear([System.Drawing.Color]::White)
          $brush = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(31, 78, 121))
          $graphics.FillRectangle($brush, 24, 24, 208, 208)
          $font = New-Object System.Drawing.Font('Arial', 88, [System.Drawing.FontStyle]::Bold)
          $textBrush = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::White)
          $graphics.DrawString('MM', $font, $textBrush, 31, 75)
          $bitmap.Save('src-tauri/icon-source.png', [System.Drawing.Imaging.ImageFormat]::Png)
          $graphics.Dispose()
          $brush.Dispose()
          $textBrush.Dispose()
          $font.Dispose()
          $bitmap.Dispose()
          Write-Host "Created src-tauri/icon-source.png"

      - name: Generate Tauri icons
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force "src-tauri/icons" -ErrorAction SilentlyContinue
          tauri icon "src-tauri/icon-source.png"
          if (-not (Test-Path "src-tauri/icons/icon.ico")) {
            throw "Tauri did not generate src-tauri/icons/icon.ico"
          }
          Write-Host "Generated Windows ICO with Tauri icon tooling"

      - name: Build Windows installer
        run: tauri build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: material-management-system-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
